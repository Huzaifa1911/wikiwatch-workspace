[project]
name = "wikiwatch-service"
version = "1.0.0"
description = "Instructor-provided WikiWatch API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1", "alembic>=1.14,<2", "pydantic[email]>=2.9,<3", "pydantic-settings>=2.6,<3", "argon2-cffi>=23,<26"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.7,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
