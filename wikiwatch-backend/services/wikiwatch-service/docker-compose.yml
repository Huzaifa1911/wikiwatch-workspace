services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wikiwatch
      POSTGRES_USER: wikiwatch
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiwatch -d wikiwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      WIKIWATCH_DATABASE_URL: postgresql+asyncpg://wikiwatch:local-only-password@db:5432/wikiwatch
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/wikiwatch-service/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
volumes:
  db-data:
